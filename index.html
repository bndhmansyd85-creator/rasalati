<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><link rel="manifest" href="manifest.json"><title>رسالتي V6</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#d9dbd5}.app,.chat{max-width:560px;margin:auto;height:100vh}.app{background:#fff;display:flex;flex-direction:column}.top{background:#075e54;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:bold}.sub{font-size:11px;opacity:.8}.search{padding:8px;background:#f0f2f5}.search input{width:100%;padding:11px;border:0;border-radius:22px}.list{flex:1;overflow:auto}.row{display:flex;gap:12px;padding:13px;border-bottom:1px solid #eee;cursor:pointer}.av{width:50px;height:50px;border-radius:50%;background:#128c7e;color:white;display:grid;place-items:center;font-weight:bold;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.info{flex:1}.last{color:#777;font-size:13px;margin-top:5px}.fab{position:absolute;left:20px;bottom:20px;width:58px;height:58px;border:0;border-radius:50%;background:#25d366;color:white;font-size:28px}.chat{display:none;position:fixed;inset:0;background:#efeae2;z-index:5;flex-direction:column}.head{background:#075e54;color:white;padding:9px;display:flex;gap:8px;align-items:center}.back{background:none;border:0;color:white;font-size:28px}.msgs{flex:1;overflow:auto;padding:14px}.b{max-width:82%;background:#fff;padding:9px 12px;border-radius:9px;margin:6px 0;box-shadow:0 1px 1px #ccc;word-break:break-word}.mine{margin-right:auto;background:#dcf8c6}.b img{max-width:100%;border-radius:8px}.b audio{max-width:100%}.composer{display:flex;gap:5px;padding:8px;background:#eee;align-items:center}.composer input{flex:1;border:0;border-radius:20px;padding:11px}.tool,.send{border:0;border-radius:50%;width:42px;height:42px;background:#128c7e;color:#fff}.file{display:none}.modal{border:0;border-radius:15px;width:90%;max-width:420px;padding:20px}.modal input,.modal textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:9px}.primary{border:0;background:#075e54;color:#fff;padding:11px 18px;border-radius:9px}.typing{font-size:11px;color:#d8fff9}</style></head><body>
<div class="app"><div class="top"><div><div class="brand">رسالتي</div><div id="status" class="sub">غير متصل</div></div><button class="tool" onclick="profile()">👤</button></div><div class="search"><input id="search" placeholder="بحث في المحادثات" oninput="render()"></div><div id="list" class="list"></div><button class="fab" onclick="addFriend()">＋</button></div>
<div id="chat" class="chat"><div class="head"><button class="back" onclick="closeChat()">‹</button><div><b id="cname"></b><div id="typing" class="typing"></div></div></div><div id="msgs" class="msgs"></div><div class="composer"><button class="tool" onclick="emoji()">☺</button><label class="tool" style="display:grid;place-items:center">📎<input class="file" type="file" accept="image/*" onchange="sendImage(event)"></label><button class="tool" id="mic" onclick="voice()">🎙️</button><input id="text" placeholder="اكتب رسالة..." oninput="typing(true)" onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div></div>
<dialog id="login" class="modal"><h3>إنشاء حساب</h3><input id="myname" placeholder="الاسم"><input id="myphone" placeholder="رقم الهاتف"><button class="primary" onclick="register()">دخول</button></dialog>
<dialog id="add" class="modal"><h3>إضافة صديق</h3><input id="fn" placeholder="اسم الصديق"><input id="fp" placeholder="رقم الهاتف"><button class="primary" onclick="saveFriend()">إضافة</button></dialog>
<dialog id="prof" class="modal"><h3>الملف الشخصي</h3><input id="pn"><textarea id="pb" placeholder="نبذة عنك"></textarea><input id="avatar" type="file" accept="image/*"><button class="primary" onclick="saveProfile()">حفظ</button></dialog>
<script>
let me=JSON.parse(localStorage.me||"null"),friends=JSON.parse(localStorage.friends||"[]"),msgs={},current=null,ws,timer,rec=null,chunks=[];
const $=x=>document.getElementById(x);
async function register(){let name=$("myname").value.trim(),phone=$("myphone").value.trim();if(!name||!phone)return alert("أدخل الاسم والرقم");let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone})}),x=await r.json();if(x.error)return alert(x.error);me=x.user;localStorage.me=JSON.stringify(me);$("login").close();connect();render()}
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);ws.onopen=()=>{ws.send(JSON.stringify({type:"auth",phone:me.phone}));$("status").textContent="متصل الآن"};ws.onclose=()=>$("status").textContent="غير متصل";ws.onmessage=e=>{let x=JSON.parse(e.data);if(x.type==="message"){let m=x.message,k=m.from===me.phone?m.to:m.from;(msgs[k]??=[]).push(m);if(current===k){renderMsgs();if(m.to===me.phone)ws.send(JSON.stringify({type:"read",id:m.id}))}render()}if(x.type==="typing"&&current===x.from)$("typing").textContent=x.active?"يكتب الآن...":""}}
function addFriend(){$("add").showModal()}function saveFriend(){let name=$("fn").value.trim(),phone=$("fp").value.trim();if(!name||!phone)return;friends=friends.filter(f=>f.phone!==phone);friends.unshift({name,phone});localStorage.friends=JSON.stringify(friends);$("add").close();load(phone);render()}
async function load(p){let r=await fetch("/api/messages/"+encodeURIComponent(p),{headers:{"x-phone":me.phone}});msgs[p]=await r.json()}
async function openChat(p){await load(p);current=p;$("cname").textContent=(friends.find(x=>x.phone===p)||{}).name||p;$("chat").style.display="flex";renderMsgs()}
function closeChat(){typing(false);$("chat").style.display="none";current=null}
function render(){let q=$("search").value.trim(),box=$("list");box.innerHTML="";let a=friends.filter(f=>f.name.includes(q)||f.phone.includes(q));if(!a.length){box.innerHTML='<div style="text-align:center;padding:50px;color:#777">لا توجد محادثات<br>اضغط ＋ لإضافة صديق</div>';return}a.forEach(f=>{let d=document.createElement("div");d.className="row";d.onclick=()=>openChat(f.phone);d.innerHTML='<div class="av">'+esc(f.name[0])+'</div><div class="info"><b>'+esc(f.name)+'</b><div class="last">'+esc((msgs[f.phone]||[]).at(-1)?.text||f.phone)+'</div></div>';box.appendChild(d)})}
function renderMsgs(){let b=$("msgs");b.innerHTML="";(msgs[current]||[]).forEach(m=>{let d=document.createElement("div");d.className="b "+(m.from===me.phone?"mine":"");if(m.kind==="image"&&m.media)d.innerHTML='<img src="'+m.media+'">';else if(m.kind==="audio"&&m.media)d.innerHTML='<audio controls src="'+m.media+'"></audio>';else d.textContent=m.text;b.appendChild(d)});b.scrollTop=b.scrollHeight}
function send(){let t=$("text").value.trim();if(!t||!current||ws?.readyState!==1)return;ws.send(JSON.stringify({type:"message",to:current,text:t,kind:"text"}));$("text").value="";typing(false)}
function sendImage(e){let f=e.target.files[0];if(!f||!current||ws?.readyState!==1)return;if(f.size>2*1024*1024)return alert("الصورة أكبر من 2MB");let r=new FileReader();r.onload=()=>ws.send(JSON.stringify({type:"message",to:current,kind:"image",media:r.result,text:""}));r.readAsDataURL(f);e.target.value=""}
function voice(){if(!navigator.mediaDevices?.getUserMedia)return alert("المتصفح لا يدعم التسجيل الصوتي");if(rec&&rec.state==="recording"){rec.stop();$("mic").textContent="🎙️";return}navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:"audio/webm"});if(blob.size>2*1024*1024)return alert("التسجيل أكبر من 2MB");let r=new FileReader();r.onload=()=>ws.send(JSON.stringify({type:"message",to:current,kind:"audio",media:r.result,text:"🎙️ رسالة صوتية"}));r.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};rec.start();$("mic").textContent="⏹️"}).catch(()=>alert("اسمح للتطبيق باستخدام الميكروفون"))}
function typing(on){if(!current||ws?.readyState!==1)return;ws.send(JSON.stringify({type:"typing",to:current,active:on}));clearTimeout(timer);if(on)timer=setTimeout(()=>typing(false),1000)}
function emoji(){$("text").value+=" 😊";$("text").focus()}
function profile(){$("pn").value=me.name||"";$("pb").value=me.bio||"";$("prof").showModal()}
async function saveProfile(){let av="",f=$("avatar").files[0];if(f){if(f.size>2*1024*1024)return alert("الصورة أكبر من 2MB");av=await new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}let r=await fetch("/api/profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:me.phone,name:$("pn").value,bio:$("pb").value,avatar:av})});me=await r.json();localStorage.me=JSON.stringify(me);$("prof").close()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(!me)$("login").showModal();else connect();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
